<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice {{NUMBER}}</title>
<style>
  @page { size: Letter; margin: 0.75in; }
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; color: #111; font-size: 13px; line-height: 1.45; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
  h1 { font-size: 28px; letter-spacing: 0.08em; margin: 0 0 6px; color: #0b3d5c; }
  .muted { color: #666; }
  .meta td { padding: 2px 12px 2px 0; }
  .parties { display: flex; gap: 48px; margin: 22px 0 26px; }
  .parties h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #666; }
  table.items { width: 100%; border-collapse: collapse; }
  table.items th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #666; border-bottom: 2px solid #0b3d5c; padding: 8px 6px; }
  table.items td { padding: 9px 6px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  table.items tr.total td { border-bottom: none; font-weight: 700; font-size: 15px; padding-top: 14px; }
  .pay { margin-top: 30px; padding: 14px 16px; background: #f4f7f9; border-radius: 6px; }
  .pay h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #666; }
  .notes { margin-top: 22px; color: #444; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>INVOICE</h1>
      <table class="meta">
        <tr><td class="muted">Invoice #</td><td><strong>{{NUMBER}}</strong></td></tr>
        <tr><td class="muted">Date</td><td>{{DATE}}</td></tr>
        <tr><td class="muted">Due</td><td>{{DUE}}</td></tr>
      </table>
    </div>
    <div style="text-align:right">
      <strong style="font-size:16px">{{BUSINESS_NAME}}</strong><br>
      <span class="muted">{{BUSINESS_LINES}}</span>
    </div>
  </div>

  <div class="parties">
    <div><h3>Bill to</h3><strong>{{CLIENT_NAME}}</strong><br><span class="muted">{{CLIENT_LINES}}</span></div>
  </div>

  <table class="items">
    <thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Unit price</th><th class="n">Amount</th></tr></thead>
    <tbody>
      {{ROWS}}
      <tr><td colspan="3" class="n muted">Subtotal</td><td class="n">{{SUBTOTAL}}</td></tr>
      {{TAX_ROW}}
      <tr class="total"><td colspan="3" class="n">Total due</td><td class="n">{{TOTAL}}</td></tr>
    </tbody>
  </table>

  <div class="pay"><h3>Payment</h3>{{PAYMENT}}</div>
  <p class="notes">{{NOTES}}</p>
</body>
</html>
