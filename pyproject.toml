[project]
name = "jarvis"
version = "0.1.0"
description = "Ben's personal AI assistant: permission guard, audit log, dashboard, and helpers around Hermes Agent."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "python-pptx>=1.0,<2",
    "uvicorn>=0.30,<1",
    "websockets>=12,<16",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "freezegun>=1.5,<2",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
